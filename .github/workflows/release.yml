# 打 tag（如 v2.0.1）时自动构建并发布 GitHub Release
# jar 自动命名为 wacko-beacons-unofficial-port-<tag版本>.jar
name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build with version from tag
        run: ./gradlew build -Pmod_version=${GITHUB_REF_NAME#v}
      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/wacko-beacons-unofficial-port-*.jar
          generate_release_notes: true
